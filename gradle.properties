# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Gradle 8.14.x supports running on JDK 17..24.
# If your default JDK is not 17..24, point Gradle at a suitable one here.
# Example (Android Studio's bundled JBR):
#   org.gradle.java.home=C\:\\Program Files\\Android\\Android Studio\\jbr
